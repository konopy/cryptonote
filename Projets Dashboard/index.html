<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projets Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234c8dff'/%3E%3Crect x='3' y='8' width='2.5' height='5' fill='%23fff'/%3E%3Crect x='6.7' y='5' width='2.5' height='8' fill='%23fff'/%3E%3Crect x='10.4' y='3' width='2.5' height='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <strong id="marca-nombre">Projets Dashboard</strong>
        <span id="marca-desc">Panel de control de proyectos</span>
      </div>
      <div class="lista-proyectos" id="lista-proyectos"></div>
      <div class="pie-lateral">
        <button id="btn-imprimir">Imprimir / PDF</button>
        Los datos viven en <code>data/proyectos/*.json</code>.
        Añade un proyecto con <code>tools/nuevo_proyecto.py</code>.
      </div>
    </aside>
    <main class="contenido" id="contenido">
      <p class="vacio">Cargando…</p>
    </main>
  </div>

  <script src="assets/metricas.js"></script>
  <!-- bundle: permite abrir el panel con doble clic (file://) sin servidor -->
  <script src="data/bundle.js" onerror="void 0"></script>
  <script src="assets/app.js"></script>
</body>
</html>
